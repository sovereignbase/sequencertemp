<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Failing convergence tests</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fafafa;
        color: #111;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        padding: 12px 16px;
        border-bottom: 1px solid #bbb;
        background: rgba(250, 250, 250, 0.96);
      }

      h1 {
        margin: 0 0 4px;
        font: 700 18px system-ui;
      }
      header p {
        margin: 0;
        font: 13px system-ui;
        color: #555;
      }
      main {
        padding: 12px;
      }

      details.test {
        margin-bottom: 10px;
        border: 1px solid #aaa;
        background: white;
      }

      details.test > summary {
        cursor: pointer;
        padding: 10px 12px;
        font: 700 14px system-ui;
      }

      .test-content {
        overflow-x: auto;
        border-top: 1px solid #ddd;
        padding: 12px;
      }

      .note,
      .error {
        max-width: 1100px;
        margin: 0 0 10px;
        white-space: pre-wrap;
        font: 13px/1.4 system-ui;
      }

      .error {
        padding: 8px;
        border: 2px solid #b00020;
        background: #fff0f2;
        color: #8a0018;
        font-family: inherit;
      }

      .stages {
        display: flex;
        align-items: flex-start;
        gap: 18px;
        width: max-content;
      }

      .stage {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 340px;
        max-width: 760px;
      }

      .stage > h2 {
        margin: 0;
        font: 700 14px system-ui;
      }

      .replica {
        padding: 9px;
        border: 1px solid #888;
        background: #fff;
      }

      .replica.mismatch {
        border: 3px solid #c00020;
      }
      .replica.match {
        border: 2px solid #16811b;
      }
      .replica > h3 {
        margin: 0 0 6px;
        font: 700 13px system-ui;
      }

      .status {
        margin-bottom: 6px;
        padding: 4px 6px;
        background: #eee;
        white-space: pre-wrap;
        font-size: 12px;
      }

      .strip {
        width: max-content;
        max-width: 100%;
        margin: 1px 0;
        border: 1px solid red;
        overflow-wrap: anywhere;
        font-weight: 700;
      }

      .strip.gate {
        background: #fff5b8;
      }
      .strip .flags {
        color: #6b2a8a;
      }

      .values,
      .value-walk {
        width: max-content;
        max-width: 100%;
        margin-top: 5px;
        overflow-wrap: anywhere;
        font-weight: 700;
      }

      .values {
        border: 1px solid blue;
      }
      .value-walk {
        border: 1px solid green;
      }
      .read-error {
        border-color: #b00020;
        color: #b00020;
      }

      .sequence {
        margin-top: 5px;
        max-width: 720px;
        font-size: 11px;
      }

      .sequence pre {
        max-height: 260px;
        overflow: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Failaavien testien structural inspector</h1>
      <p>
        Punainen = stripit, sininen = values(), vihreä = value(i). Ensimmäinen
        replica on vertailupohja. Testien pitkät merkkijonoarvot näytetään
        samoina a/b/c-aliasina kaikilla replicoilla.
      </p>
    </header>
    <main id="app"></main>
    <script type="module" src="./index.js"></script>
  </body>
</html>
