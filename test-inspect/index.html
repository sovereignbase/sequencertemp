<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test inspect</title>
    <style>
      body {
        margin: 0;
        font-family: serif;
      }

      details.test > summary {
        cursor: pointer;
        padding: 0.5rem;
        font-weight: bold;
      }

      .test-content {
        overflow-x: auto;
      }

      .stages {
        display: flex;
        align-items: flex-start;
        gap: 2rem;
        width: max-content;
      }

      .stage,
      .replica {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: max-content;
      }

      .stage {
        gap: 1rem;
        padding: 1rem;
      }

      h2,
      h3 {
        margin: 0;
        font-size: 1rem;
      }

      .strip,
      .values,
      .value-walk {
        width: max-content;
        height: max-content;
        font-weight: bold;
      }

      .strip {
        border: 1px solid red;
      }

      .values {
        margin-top: 0.25rem;
        border: 1px solid blue;
      }

      .value-walk {
        border: 1px solid green;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./index.js?v=4"></script>
  </body>
</html>
